# CSP defined once here (nginx doesn't merge add_header across location
# blocks — see the comment in the server block below) so all three
# locations that need it reference the same $csp variable instead of
# duplicating, and potentially drifting from, the same long string.
map $host $csp {
    default "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://lotus-tur-production-23c6.up.railway.app; connect-src 'self' https://lotus-tur-production-23c6.up.railway.app https://accounts.google.com https://id.vk.com; frame-src https://accounts.google.com https://id.vk.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers for the static frontend. The API already
    # sets these via SecurityHeadersMiddleware; the static site (served
    # directly by nginx, not through the FastAPI app) previously shipped
    # with none at all.
    #
    # CSP allow-list reflects what this codebase actually loads (checked
    # against frontend/js/*.js and *.html as of this audit):
    #   - script-src/style-src 'unsafe-inline': the codebase relies
    #     extensively on inline onclick="..." handlers and inline
    #     style="..." attributes throughout admin.html/ui.js. A stricter
    #     script-src would break the app outright. This CSP is still
    #     real defence-in-depth against *injected* <script src=evil>
    #     tags and most reflected-XSS payload shapes, even though it
    #     can't stop inline-handler-shaped injection — pair it with the
    #     escHtml()-everywhere discipline already used in JS, not as a
    #     replacement for it.
    #   - connect-src: the Railway backend API origin (apiFetch's
    #     API_BASE) plus Google/VK OAuth token endpoints.
    #   - img-src: Unsplash (placeholder tour photos in data.js) plus
    #     the backend's own /static/uploads (admin-uploaded media).
    #   - font-src/style-src: Google Fonts.
    #   - frame-src: Google/VK OAuth login popups.
    # Update the map above if a new external host is ever added to the JS.
    #
    # NOTE: nginx does NOT merge add_header lists across levels — a
    # location block that declares its own add_header resets the parent's
    # list instead of appending to it. That's why these five lines are
    # repeated in every location block below rather than relied on by
    # inheritance.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy $csp always;
    # Safety net for "/" resolving internally to index.html via the
    # `index` directive above — inherited by location / below since
    # that block declares no add_header of its own. The explicit
    # html/css/js location further down repeats this for direct,
    # by-name requests (e.g. /admin.html).
    add_header Cache-Control "no-cache, must-revalidate" always;

    # HTML/CSS/JS: never serve a stale copy without checking first.
    # `no-cache` (despite the name) still lets the browser keep a local
    # copy — it just forces a conditional request (If-None-Match) on
    # every load. nginx auto-generates ETag/Last-Modified for static
    # files, so an unchanged file gets a tiny "304 Not Modified" reply
    # instead of a full re-download, and a changed file (after a deploy)
    # is always picked up immediately. style.css's `@import`-ed files
    # (variables.css, nav.css, etc.) get the same treatment, which is
    # why this is simpler and more robust here than per-file versioning.
    location ~* \.(?:html|css|js)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Photos change rarely and aren't revalidated above — a moderate
    # cache keeps repeat visits fast without risking long-term staleness.
    # (Images uploaded via the new admin media manager get random,
    # never-reused filenames, so they're cache-safe forever regardless —
    # this rule is really only for the bundled tour photos in img/.)
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy $csp always;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}