server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers for the static frontend. The API already
    # sets these via SecurityHeadersMiddleware; the static site (served
    # directly by nginx, not through the FastAPI app) previously shipped
    # with none at all.
    #
    # NOTE: nginx does NOT merge add_header lists across levels — a
    # location block that declares its own add_header resets the parent's
    # list instead of appending to it. That's why these four lines are
    # repeated in every location block below rather than relied on by
    # inheritance.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Safety net for "/" resolving internally to index.html via the
    # `index` directive above — inherited by location / below since
    # that block declares no add_header of its own. The explicit
    # html/css/js location further down repeats this for direct,
    # by-name requests (e.g. /admin.html).
    add_header Cache-Control "no-cache, must-revalidate" always;

    # HTML/CSS/JS: never serve a stale copy without checking first.
    # `no-cache` (despite the name) still lets the browser keep a local
    # copy — it just forces a conditional request (If-None-Match) on
    # every load. nginx auto-generates ETag/Last-Modified for static
    # files, so an unchanged file gets a tiny "304 Not Modified" reply
    # instead of a full re-download, and a changed file (after a deploy)
    # is always picked up immediately. style.css's `@import`-ed files
    # (variables.css, nav.css, etc.) get the same treatment, which is
    # why this is simpler and more robust here than per-file versioning.
    location ~* \.(?:html|css|js)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Photos change rarely and aren't revalidated above — a moderate
    # cache keeps repeat visits fast without risking long-term staleness.
    # (Images uploaded via the new admin media manager get random,
    # never-reused filenames, so they're cache-safe forever regardless —
    # this rule is really only for the bundled tour photos in img/.)
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}